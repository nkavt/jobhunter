name: Release

# Publishing a GitHub Release (tag vX.Y.Z) stages that version on npm. It goes live once a
# maintainer approves it on npmjs.com with 2FA, so a compromised workflow can't ship on its own.
# Uses npm Trusted Publishing: npm trusts this workflow, so no npm token is stored in GitHub.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify this run comes from this repository and workflow

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing and `npm stage` need a recent npm 11.
      - run: npm install -g npm@11
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME doesn't match package.json version $version."
            exit 1
          fi
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Stage the release on npm
        run: npm stage publish
      - name: Next step
        run: echo "::notice::Staged on npm. Approve it at https://www.npmjs.com/package/jobhunter (or with \`npm stage approve\`) to publish it."
