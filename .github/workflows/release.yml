name: Release

# Publishing a GitHub Release (tag vX.Y.Z) publishes that version to npm.
# Uses npm Trusted Publishing: npm trusts this workflow, so no npm token is stored in GitHub.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify this run comes from this repository and workflow

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME doesn't match package.json version $version."
            exit 1
          fi
      - run: npm ci
      - run: npm run format:check
      # prepublishOnly runs typecheck, lint, tests and the build before uploading.
      - run: npm publish
